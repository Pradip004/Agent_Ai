databases:
  - name: smart-student-db
    databaseName: smart_student
    plan: free

services:
  - type: web
    name: smart-student-ai
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn student_ai.wsgi:application"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-student-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: OPENAI_API_KEY
        sync: false
