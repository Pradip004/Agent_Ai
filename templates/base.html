<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Office AI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --ink: #17243b; --muted: #718096; --line: #e6ebf2; --brand: #3559e8; }
    body { background: #f5f7fb; color: var(--ink); }
    .navbar { background: #fff; border-bottom: 1px solid var(--line); }
    .navbar-brand { color: var(--ink); font-weight: 700; letter-spacing: -.03em; }
    .navbar .nav-link { color: #536179; }
    .navbar .nav-link:hover { color: var(--brand); }
    .card { border: 1px solid var(--line); border-radius: 16px; }
    .btn-primary { background: var(--brand); border-color: var(--brand); }
    .chat-shell { max-width: 1040px; margin: 0 auto; }
    .chat-bubble { border-radius: 16px; padding: 14px 18px; max-width: 88%; }
    .chat-user { background: #e9edff; margin-left: auto; }
    .chat-assistant { background: #fff; border: 1px solid var(--line); }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light">
  <div class="container-fluid px-lg-5">
    <a class="navbar-brand" href="{% url 'ask_ai' %}">Smart Office AI</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavigation">
    <ul class="navbar-nav ms-auto flex-row flex-wrap gap-lg-3">
      <li class="nav-item"><a class="nav-link" href="{% url 'ask_ai' %}">Ask AI</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'candidate_list' %}">Candidates</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Students</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'student_add' %}">Add / Import Students</a></li>
    </ul>
    </div>
  </div>
</nav>
<main class="container-fluid px-lg-5 py-4">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
